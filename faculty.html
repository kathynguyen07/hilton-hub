<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hilton College Faculty Directory</title>
<style>
  :root { --bg:#f5f4f0; --card:#ffffff; --border:#e2e0d8; --text:#26251f; --sub:#6b6a63; --muted:#93928a; --accent:#0F6E56; --focus:#B5541A; --reach:#5D4A9C; --reach2:#1B6E6B; --tbd:#B4B2A9; --pay:#8C5A0F; --person-accent: #0F6E56; --cross:#5D4A9C; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); }
  header { padding: 28px 24px 12px; text-align:center; }
  header h1 { font-size:22px; font-weight:600; margin:0 0 4px; }
  header p { font-size:13px; color:var(--sub); margin:0; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; padding: 16px 24px 4px; }
  .filters button { font-size:13px; padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--card); cursor:pointer; color:var(--sub); }
  .filters button.active { background:var(--text); color:#fff; border-color:var(--text); }
  .filters button.focus-btn { border-color: var(--focus); color: var(--focus); font-weight:600; }
  .filters button.focus-btn.active { background: var(--focus); color:#fff; }
  .filters button.reach-btn { border-color: var(--reach); color: var(--reach); font-weight:600; }
  .filters button.reach-btn.active { background: var(--reach); color:#fff; }
  .filters button.reach2-btn { border-color: var(--reach2); color: var(--reach2); font-weight:600; }
  .filters button.reach2-btn.active { background: var(--reach2); color:#fff; }
  .divider { width:1px; align-self:stretch; background:var(--border); margin: 0 4px; }
  .count { text-align:center; font-size:12px; color:var(--muted); margin: 8px 0 12px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap:16px; padding: 0 24px 40px; max-width:1400px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; cursor:pointer; transition:box-shadow .15s, transform .1s; }
  .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.08); transform: translateY(-1px); }
  .card.advisor { border-color: var(--accent); }
  .card.focus { border-color: var(--focus); border-width:2px; }
  .card.reachout { border-color: var(--reach); border-width:2px; }
  .card.reachout2 { border-color: var(--reach2); border-width:2px; }
  .card img { width:100%; aspect-ratio: 200/244; object-fit:cover; display:block; background:#ddd; }
  .card .body { padding:12px 14px 14px; flex:1; display:flex; flex-direction:column; gap:6px; }
  .card .name { font-size:15px; font-weight:600; margin:0; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; }
  .tier-pill { display:inline-block; font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:10px; color:#fff; width:fit-content; }
  .advisor-pill { display:inline-block; font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:10px; color:var(--accent); background:#e1f5ee; width:fit-content; }
  .focus-pill { display:inline-block; font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:10px; color:#fff; background:var(--focus); width:fit-content; }
  .reach-pill { display:inline-block; font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:10px; color:#fff; background:var(--reach); width:fit-content; }
  .reach2-pill { display:inline-block; font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:10px; color:#fff; background:var(--reach2); width:fit-content; }
  .card .title { font-size:12px; color:var(--sub); margin:0; line-height:1.4; }
  .card .edu { font-size:11px; color:var(--muted); margin:0; line-height:1.4; }
  .section-label { font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-top:6px; }
  .card ul { margin:2px 0 0; padding-left:16px; font-size:11.5px; line-height:1.5; color:var(--text); }
  .card ul li { margin-bottom:1px; }
  .org-box { font-size:11.5px; color:var(--text); background:#f5f4f0; border-radius:6px; padding:4px 8px; margin-top:2px; }
  .fall-box { font-size:11.5px; color:#fff; background:var(--focus); border-radius:6px; padding:4px 8px; margin-top:2px; }
  .click-hint { font-size:10.5px; color:var(--muted); margin-top:auto; padding-top:6px; border-top:1px dashed var(--border); }

  #detail { display:none; max-width:1000px; margin:0 auto; padding: 20px 24px 60px; }
  .back-btn { font-size:13px; padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--card); cursor:pointer; color:var(--sub); margin-bottom:18px; }
  .detail-head { display:flex; gap:20px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; border-top:4px solid var(--person-accent); }
  .detail-head img { width:150px; height:183px; object-fit:cover; border-radius:10px; flex-shrink:0; }
  .detail-head h2 { font-size:20px; font-weight:600; margin:0 0 4px; }
  .detail-head .dtitle { font-size:13px; color:var(--sub); margin:0 0 8px; }
  .contact-row { font-size:12px; color:var(--muted); margin-top:8px; }
  .detail-cols { display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:20px; }
  .detail-block { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
  .detail-block h3 { font-size:13px; font-weight:600; margin:0 0 8px; text-transform:uppercase; letter-spacing:.03em; color:var(--sub); }
  .detail-block ul { margin:0; padding-left:18px; font-size:13px; line-height:1.6; }
  .full-width { grid-column: 1 / -1; }

  .db-section { margin-top:28px; }
  .db-section h2 { font-size:17px; font-weight:600; margin:0 0 4px; color:var(--person-accent); }
  .db-note { font-size:11.5px; color:var(--muted); background:#fbf8ee; border:1px solid #ecdfb8; border-radius:8px; padding:8px 14px; margin: 8px 0 16px; }
  .filter-group { margin-bottom:10px; }
  .filter-group-label { font-size:11px; font-weight:600; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .chip-row { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:11.5px; padding:4px 10px; border-radius:14px; border:1px solid var(--border); background:var(--card); cursor:pointer; color:var(--sub); }
  .chip.active { background:var(--person-accent); color:#fff; border-color:var(--person-accent); }
  .chip.tbd { border-style:dashed; }
  .clear-btn { font-size:11.5px; color:var(--reach); background:none; border:none; cursor:pointer; text-decoration:underline; margin-left:4px; }
  .paper-count { font-size:12px; color:var(--muted); margin: 12px 0 10px; }
  .paper-card { background:var(--card); border:1px solid var(--border); border-left:3px solid var(--person-accent); border-radius:10px; padding:12px 16px; margin-bottom:10px; }
  .paper-card .prow { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; cursor:pointer; }
  .paper-card .ptitle { font-size:13.5px; font-weight:600; margin:0; }
  .paper-card .pmeta { font-size:11.5px; color:var(--muted); margin:4px 0 0; }
  .pill-row { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .pill { font-size:10px; font-weight:600; padding:2px 7px; border-radius:9px; }
  .pill.status { background:#e6f1fb; color:#0C447C; }
  .pill.sector { background:#eaf3de; color:#27500A; }
  .pill.rel-high { background:#eaf3de; color:#173404; }
  .pill.rel-medium { background:#faeeda; color:#633806; }
  .pill.rel-low { background:#f1efe8; color:#444441; }
  .pill.tbd { background:#f1efe8; color:#5f5e5a; border:1px dashed #b4b2a9; }
  .pill.access-free { background:#e1f5ee; color:var(--person-accent); }
  .pill.access-pay { background:#f7ecd9; color:var(--pay); }
  .cross-badge { display:inline-block; font-size:11px; font-weight:600; color:var(--cross); background:#eeeafb; border-left:3px solid var(--cross); padding:4px 9px; border-radius:6px; margin-top:8px; }
  .link-row { margin-top:8px; }
  .link-free { display:inline-block; font-size:11.5px; font-weight:600; color:#fff; background:var(--person-accent); padding:4px 10px; border-radius:6px; text-decoration:none; }
  .link-pay { display:inline-block; font-size:11.5px; color:var(--pay); border:1px solid var(--pay); padding:4px 10px; border-radius:6px; text-decoration:none; }
  .link-none { display:inline-block; font-size:11.5px; color:var(--muted); font-style:italic; }
  .paper-detail { display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); font-size:12.5px; }
  .paper-detail.open { display:block; }
  .pd-row { display:flex; gap:8px; margin-bottom:6px; }
  .pd-label { min-width:130px; font-weight:600; color:var(--sub); flex-shrink:0; }
  .pd-val { color:var(--text); }
  .pd-val.tbd-val { color:var(--tbd); font-style:italic; }
  .strategic-block { background:#FBF3E3; border:1px solid #E3C888; border-radius:12px; padding:16px 18px; margin-top:20px; }
  .strategic-block h3 { font-size:14px; font-weight:600; margin:0 0 6px; color:#7A5A0F; }
  .strategic-block .intro { font-size:12.5px; color:#5c4a1f; margin:0 0 12px; line-height:1.5; }
  .strategic-table { width:100%; border-collapse:collapse; font-size:12px; }
  .strategic-table th, .strategic-table td { text-align:left; padding:6px 8px; border-bottom:1px solid #E3C888; vertical-align:top; }
  .strategic-table th { font-size:10.5px; text-transform:uppercase; color:#8a6a1f; }
  .directions-block { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-top:20px; }
  .directions-block h3 { font-size:13px; font-weight:600; margin:0 0 8px; text-transform:uppercase; letter-spacing:.03em; color:var(--sub); }
  .directions-block ul { margin:0; padding-left:18px; font-size:13px; line-height:1.6; }
  .sitenav { background:#1b1a16; padding:10px 24px; display:flex; gap:16px; align-items:center; }
  .sitenav a { color:#f5f4f0; text-decoration:none; font-size:13px; padding:6px 12px; border-radius:6px; }
  .sitenav a.active { background:#3a3830; font-weight:600; }
</style>
</head>
<body>
<div class="sitenav">
  <a href="index.html">Home</a>
  <a href="faculty.html" class="active">Faculty Directory</a>
  <a href="phd-pathway.html">PhD Pathway</a>
</div>
<header>
  <h1>Conrad N. Hilton College of Global Hospitality Leadership — Faculty Directory</h1>
  <p id="headerSub"></p>
</header>

<div id="listView">
  <div class="filters" id="filters"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="detail"></div>

<script src="faculty-data.js"></script>
</body>
</html>
